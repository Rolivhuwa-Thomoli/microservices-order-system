# Starts everything: PostgreSQL, Eureka, the API gateway and the 4 services.
# Run "mvn package" first, then "docker compose up --build".
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app        # demo password only, change it for real use
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  discovery-server:
    build: { context: ., args: { SERVICE: discovery-server } }
    ports: ["8761:8761"]

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on: [discovery-server]

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    ports: ["8081:8081"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  inventory-service:
    build: { context: ., args: { SERVICE: inventory-service } }
    ports: ["8082:8082"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    ports: ["8083:8083"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  shipping-service:
    build: { context: ., args: { SERVICE: shipping-service } }
    ports: ["8084:8084"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipping_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
