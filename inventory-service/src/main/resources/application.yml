server:
  port: 8082

spring:
  application:
    name: inventory-service
  # H2 (in memory) by default, so the service runs without installing anything.
  # docker-compose.yml switches every service to PostgreSQL with environment variables.
  datasource:
    url: jdbc:h2:mem:inventory_service;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
